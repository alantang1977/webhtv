name: Sync Upstream Releases
on:
  schedule:
    - cron: '30 */6 * * *'   # 每 6 小时检查一次
  workflow_dispatch:
    inputs:
      force:
        description: '强制覆盖已存在的同名 Release（重新上传资产）'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

env:
  UPSTREAM_REPO: Silent1566/webhtv

jobs:
  sync-releases:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 同步上游 Tags 到本仓库
        run: |
          git remote add upstream "https://github.com/${{ env.UPSTREAM_REPO }}.git" 2>/dev/null || \
            git remote set-url upstream "https://github.com/${{ env.UPSTREAM_REPO }}.git"
          git fetch upstream --tags --force --prune
          git push origin --tags --force

      - name: 镜像上游 Releases（代码+资产+说明）
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force == true && '1' || '0' }}
        run: |
          set -euo pipefail
          UPSTREAM="${{ env.UPSTREAM_REPO }}"

          gh release list -R "$UPSTREAM" --limit 100 --json tagName \
            --jq '.[].tagName' | while read -r TAG; do

            echo "===== 处理 Release: $TAG ====="

            if [ "$FORCE" != "1" ] && gh release view "$TAG" >/dev/null 2>&1; then
              echo "  已存在，跳过（需覆盖请手动触发并勾选 force）"
              continue
            fi

            rm -rf /tmp/assets && mkdir -p /tmp/assets
            if ! gh release download "$TAG" -R "$UPSTREAM" -p '*' -D /tmp/assets; then
              echo "  资产下载失败，跳过 $TAG"
              continue
            fi

            gh release view "$TAG" -R "$UPSTREAM" --json body,isPrerelease \
              --jq '"\(.body)¦\(.isPrerelease)"' > /tmp/meta.txt
            NOTES="$(cut -d'¦' -f1 /tmp/meta.txt)"
            PRE="$(cut -d'¦' -f2 /tmp/meta.txt)"
            PRERELEASE_FLAG=""
            [ "$PRE" = "true" ] && PRERELEASE_FLAG="--prerelease"

            if [ "$FORCE" = "1" ] && gh release view "$TAG" >/dev/null 2>&1; then
              gh release delete "$TAG" --yes --cleanup-tag
            fi

            if gh release view "$TAG" >/dev/null 2>&1; then
              gh release upload "$TAG" /tmp/assets/* --clobber
            else
              gh release create "$TAG" --target main \
                --title "$TAG" --notes "$NOTES" $PRERELEASE_FLAG /tmp/assets/*
            fi
            echo "  已同步 $TAG"
          done
          echo "===== 全部 Release 同步完成 ====="
